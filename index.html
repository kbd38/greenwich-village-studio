  var form = document.getElementById("gate"), pw = document.getElementById("pw"),

  if(!window.crypto || !crypto.subtle){
    gerr.textContent = "This page needs a secure (https) connection to unlock.";
    gbtn.disabled = true; return;
  }
  function norm(p){ return p.trim().toLowerCase().replace(/\s+/g, " "); }
  async function derive(p){
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(p)), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:SALT, iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  }
  async function unlock(p){
    var key = await derive(p);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:PAYLOAD.slice(0,12)}, key, PAYLOAD.slice(12));
    return {key:key, html:new TextDecoder().decode(pt)};
  }
  function open(res){
    var cache = {};
    window.LISTING = {rent: RENT_RANGE, available: AVAILABLE_DATE};
    window.GATE = {
      img: function(name){
        if(!cache[name]){
          cache[name] = fetch("images/" + name + ".enc").then(function(r){
            if(!r.ok) throw new Error("image " + r.status); return r.arrayBuffer();
          }).then(function(buf){
            return crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(buf.slice(0,12))}, res.key, buf.slice(12));
          }).then(function(plain){
            return URL.createObjectURL(new Blob([plain], {type:"image/webp"}));
          });
        }
        return cache[name];
      }
    };
    document.open(); document.write(res.html); document.close();

      remember(pw.value); open(res);

      gerr.textContent = "That password isn't right. Please try again.";
